---
name: Review notify

# Posts team review requests to #review-requests in Slack. Logic lives in themarkerr/reusable-workflows
# (docs/REVIEW-NOTIFICATIONS.md); this file only supplies the trigger GitHub requires in each repo.
on:
  pull_request:
    types: [review_requested]

permissions:
  contents: read
  id-token: write # OpenBao JWT login (granted to the called workflow)

jobs:
  notify:
    uses: themarkerr/reusable-workflows/.github/workflows/review-notify.yml@develop
